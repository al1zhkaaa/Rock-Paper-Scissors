<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>

<body>
    <button>Rock</button>
    <button>Paper</button>
    <button>Scissors</button>
    <div>
        <h1></h1>
        <p></p>
    </div>
    <script>
        const result = document.querySelector("h1");
        const buttons = document.querySelectorAll("button");
        const gameResult = document.querySelector("p");
        let gameOver = false;

        buttons.forEach((button) => {

            button.addEventListener("click", () => {
                if (gameOver) return;
                const playerSelection = button.textContent;
                const computerSelection = getComputerChoice();
                playRound(playerSelection, computerSelection);
            })
        })



        let humanScore = 0;
        let computerScore = 0;


        function playRound(humanChoice, computerChoice) {
            humanChoice = humanChoice.toLowerCase();
            computerChoice = computerChoice.toLowerCase();
            if (humanChoice === computerChoice) {
                result.textContent = `It is draw!.Your choice:${humanChoice}, Computer: ${computerChoice}. You ${humanScore} : ${computerScore} Computer`;
            } else if ((humanChoice === "rock" && computerChoice === "scissors") ||
                (humanChoice === "paper" && computerChoice === "rock") || (humanChoice === "scissors" && computerChoice === "paper")) {
                humanScore += 1;
                result.textContent = `You won!. Your choice:${humanChoice}, Computer: ${computerChoice}. You ${humanScore} : ${computerScore} Computer`;


            } else {
                computerScore += 1;
                result.textContent = `Computer wins!. Your choice:${humanChoice}, Computer: ${computerChoice}. You ${humanScore} : ${computerScore} Computer`;

            }
            if (computerScore === 5 || humanScore === 5) {
                checkWinner(humanScore, computerScore);
                gameOver = true;
            }
        }
        function getComputerChoice() {
            const choice = Math.random();
            if (choice >= 0 && choice <= 1 / 3) {
                return "rock";
            } else if (choice > 1 / 3 && choice <= 2 / 3) {
                return "paper";
            } else {
                return "scissors";
            }
        }






        function checkWinner(humanScore, computerScore) {
            if (humanScore > computerScore) {
                gameResult.textContent = "Game finished. You won!";
            }
            else {
                gameResult.textContent = "Game finished. Computer won!";
            }
        }




    </script>
</body>

</html>
