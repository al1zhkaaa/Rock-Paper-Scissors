<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>

<body>
    <script>
        function getComputerChoice() {
            const choice = Math.random();
            if (choice >= 0 && choice <= 1 / 3) {
                return "rock";
            } else if (choice > 1 / 3 && choice <= 2 / 3) {
                return "paper";
            } else {
                return "scissors";
            }
        }
        function getHumanChoice() {
            const choice = prompt("What is your choice?");
            return choice;
        }

        function playGame() {
            let humanScore = 0;
            let computerScore = 0;

            function playRound(humanChoice, computerChoice) {
                humanChoice = humanChoice.toLowerCase();
                computerChoice = computerChoice.toLowerCase();
                if (humanChoice === computerChoice) {
                    console.log(`It is draw!.Your choice:${humanChoice}, Computer: ${computerChoice}. You ${humanScore} : ${computerScore} Computer`);
                } else if ((humanChoice === "rock" && computerChoice === "scissors") ||
                    (humanChoice === "paper" && computerChoice === "rock") || (humanChoice === "scissors" && computerChoice === "paper")) {
                    humanScore += 1;
                    console.log(`You won!. Your choice:${humanChoice}, Computer: ${computerChoice}. You ${humanScore} : ${computerScore} Computer`);


                } else {
                    computerScore += 1;
                    console.log(`Computer wins!. Your choice:${humanChoice}, Computer: ${computerChoice}. You ${humanScore} : ${computerScore} Computer`);

                }
            }

            for (let i = 0; i < 5; i++) {
                const humanSelection = getHumanChoice();
                const computerSelection = getComputerChoice();
                playRound(humanSelection, computerSelection);
            }

            function gameResult(humanScore, computerScore) {
                if (humanScore === computerScore) {
                    console.log("Game finished.Result: draw")
                } else if (humanScore > computerScore) {
                    console.log("Game finished. You won!")
                }
                else {
                    console.log("Game finished. Computer won!")
                }
            }
            gameResult(humanScore, computerScore);
        }
        playGame();

    </script>
</body>

</html>
